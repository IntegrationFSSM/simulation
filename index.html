<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ory+ | Simulateur TCC — Anxiété Généralisée</title>
    <meta name="description" content="Plateforme clinique de simulation du protocole TCC (15 séances) pour le Trouble d'Anxiété Généralisée (TAG) — Oryplus ERP">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========================== SIDEBAR ========================== -->
<div class="sidebar-container">
    <div class="sidebar-header">
        <img src="../static_global/img/OryLogofig.png" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'">
        <div>
            <div class="brand-text">Ory<sup style="font-size:0.6em">+</sup> </div>
            
        </div>
    </div>

    <div class="sidebar-body">
        <div class="sidebar-section-title">Navigation</div>
        <a class="menu-item active" id="nav-dashboard" onclick="app.showPanel('dashboard')">
            <i class="fas fa-chart-pie"></i>
            <span>Tableau de Bord</span>
        </a>

        <div class="sidebar-section-title" style="margin-top:1rem">Patients</div>
        <div id="sidebar-patients"><!-- Injected --></div>

        <div class="sidebar-section-title" id="sessions-nav-label" style="display:none;margin-top:1rem">Séances TAG (15)</div>
        <div id="sidebar-sessions"><!-- Injected --></div>
    </div>
</div>

<!-- ========================== MAIN ========================== -->
<div class="main-content">
    <!-- Header -->
    <header class="top-header">
        <div class="breadcrumb-nav">
            <span class="part"><i class="fas fa-brain me-1"></i> Protocole TCC</span>
            <span class="sep">/</span>
            <span class="active-part" id="breadcrumb-current">Tableau de Bord</span>
        </div>
        <div class="header-right">
            <button class="btn-sm-icon" onclick="window.print()" title="Imprimer / Exporter PDF">
                <i class="fas fa-print"></i>
            </button>
            <div class="user-chip">
                <div class="avatar">INF</div>
                <span class="uname">Clinique Ory+</span>
            </div>
        </div>
    </header>

    <!-- Dynamic Content -->
    <div id="app-view"></div>

    <footer class="main-footer">
        &copy; <span id="footerYear"></span> Ory<sup>+</sup> — ERP Médical | CLV Tech &nbsp;
    </footer>
</div>

<!-- ========================== MODAL CONTAINER ========================== -->
<div id="modal-root"></div>

<!-- ========================== TOAST CONTAINER ========================== -->
<div class="toast-stack" id="toast-stack"></div>

<!-- ========================== TEMPLATES ========================== -->

<!-- DASHBOARD TEMPLATE -->
<template id="tpl-dashboard">
<div>
    <!-- Stats Row -->
    <div class="row g-3 mb-4" id="stats-row"><!-- Injected --></div>
    <!-- Patients Grid -->
    <div class="section-title"><i class="fas fa-users text-primary-c"></i> Dossiers Patients Actifs</div>
    <div class="row g-3" id="patients-grid"><!-- Injected --></div>
</div>
</template>

<!-- PATIENT DOSSIER TEMPLATE -->
<template id="tpl-dossier">
<div>
    <!-- Patient Header -->
    <div class="dossier-header mb-4" id="dossier-header-content"><!-- Injected --></div>

    <div class="row g-3">
        <!-- Left: Timeline -->
        <div class="col-md-5">
            <div class="panel-card mb-3">
                <div class="panel-card-header">
                    <h6><i class="fas fa-list-check me-2 text-primary-c"></i>Progression des Séances</h6>
                    <span id="dossier-progress-badge" class="badge" style="background:var(--primary);color:white;font-size:0.7rem;padding:4px 10px;border-radius:20px;"></span>
                </div>
                <div class="panel-card-body" style="max-height:500px;overflow-y:auto;">
                    <div class="session-timeline" id="dossier-session-timeline"><!-- Injected --></div>
                </div>
            </div>
        </div>

        <!-- Right: Chart + Info -->
        <div class="col-md-7">
            <div class="panel-card mb-3">
                <div class="panel-card-header">
                    <h6><i class="fas fa-chart-line me-2 text-primary-c"></i>Évolution Anxiété (GAD-7)</h6>
                </div>
                <div class="panel-card-body">
                    <canvas id="patient-chart" height="180"></canvas>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h6><i class="fas fa-circle-info me-2 text-primary-c"></i>Bilan Clinique Initial</h6>
                </div>
                <div class="panel-card-body">
                    <div id="dossier-scores-initial"><!-- Injected --></div>
                </div>
            </div>
        </div>
    </div>
</div>
</template>

<!-- SESSION DETAIL TEMPLATE -->
<template id="tpl-session">
<div class="session-layout">
    <!-- Left Sidebar -->
    <div class="session-sidebar-panel">
        <!-- Session Info -->
        <div class="panel-card">
            <div class="panel-card-header">
                <h6><i class="fas fa-clipboard-list me-2 text-primary-c"></i>Séance en cours</h6>
                <span id="session-badge" class="badge" style="background:var(--primary);color:white;font-size:0.7rem;padding:4px 10px;border-radius:20px;"></span>
            </div>
            <div class="panel-card-body">
                <div id="session-phase-badge" class="mb-2"></div>
                <div style="font-size:0.78rem;color:var(--text-muted);">
                    <i class="fas fa-clock me-1"></i><span id="session-duration"></span> min estimées
                </div>
                <div class="divider"></div>
                <div style="font-size:0.78rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Objectifs</div>
                <ul id="session-objectives" style="font-size:0.83rem;padding-left:1.2rem;color:var(--text-muted);line-height:1.8;margin:0;"></ul>
            </div>
        </div>

        <!-- Tasks Checklist -->
        <div class="panel-card">
            <div class="panel-card-header">
                <h6><i class="fas fa-tasks me-2 text-primary-c"></i>Tâches du Thérapeute</h6>
            </div>
            <div class="panel-card-body">
                <div class="step-list" id="task-checklist"><!-- Injected --></div>
            </div>
        </div>

        <!-- Materials -->
        <div class="panel-card">
            <div class="panel-card-header">
                <h6><i class="fas fa-folder-open me-2 text-primary-c"></i>Matériel Patient</h6>
            </div>
            <div class="panel-card-body">
                <div id="session-materials-list" style="font-size:0.84rem;"></div>
            </div>
        </div>

        <!-- Homeworks -->
        <div class="panel-card">
            <div class="panel-card-header">
                <h6><i class="fas fa-house-user me-2" style="color:var(--warning)"></i>Devoirs Inter-séance</h6>
            </div>
            <div class="panel-card-body">
                <ul id="session-homeworks" style="font-size:0.83rem;padding-left:1.2rem;color:var(--text-muted);line-height:1.8;margin:0;"></ul>
            </div>
        </div>
    </div>

    <!-- Right: Main Content -->
    <div>
        <!-- Session Title Card -->
        <div class="panel-card mb-3">
            <div class="panel-card-body" style="padding:1.5rem;">
                <h4 id="session-main-title" class="fw-800 mb-1" style="color:var(--primary);font-size:1.3rem;"></h4>
                <p id="session-patient-name" style="font-size:0.82rem;color:var(--text-muted);margin:0;"></p>
            </div>
        </div>

        <!-- Verbatim -->
        <div class="panel-card mb-3">
            <div class="panel-card-header">
                <h6><i class="fas fa-comments me-2 text-primary-c"></i>Script Clinique — Verbatim</h6>
                <span id="verbatim-counter" style="font-size:0.75rem;color:var(--text-muted);"></span>
            </div>
            <div class="panel-card-body">
                <div class="verbatim-container" id="verbatim-area"><!-- Injected --></div>
                <!-- Navigation -->
                <div class="verbatim-nav">
                    <button class="btn-ghost" id="btn-verbatim-prev" onclick="app.verbatimPrev()">
                        <i class="fas fa-arrow-left"></i> Précédent
                    </button>
                    <span id="verbatim-progress" style="font-size:0.8rem;color:var(--text-muted);"></span>
                    <button class="btn-primary-custom" id="btn-verbatim-next" onclick="app.verbatimNext()">
                        Suivant <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Activity Area -->
        <div id="session-activity-area"></div>

        <!-- Clinical Notes -->
        <div class="panel-card mt-3">
            <div class="panel-card-header">
                <h6><i class="fas fa-pen-to-square me-2" style="color:var(--accent)"></i>Notes Cliniques (Confidentiel)</h6>
                <button class="btn-sm-icon" onclick="app.saveNotes()" title="Sauvegarder">
                    <i class="fas fa-save"></i>
                </button>
            </div>
            <div class="panel-card-body">
                <textarea class="notes-textarea" id="clinical-notes" placeholder="Notes cliniques, observations, comportement du patient durant la séance..."></textarea>
            </div>
        </div>

        <!-- Complete Button -->
        <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
            <button class="btn-ghost" onclick="app.showPanel('dossier')">
                <i class="fas fa-arrow-left"></i> Retour au dossier
            </button>
            <button class="btn-success-custom" id="btn-complete-session" onclick="app.completeCurrentSession()">
                <i class="fas fa-check-circle"></i> Marquer séance comme terminée
            </button>
        </div>
    </div>
</div>
</template>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
    document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>
</body>
</html>
